name: CI sobel
on: 
  push:
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - name: get code from repo
      uses: actions/checkout@v4
    
    - name: Installation des librairies SDL2 et SDL2TTF
      run: sudo apt install cmake build essential libsdl2-dev libsdl2-ttf-dev


    - name: Configurer le projet avec Cmake
      run: cmake -B build
    
    - name: Compiler le projet
      run: cmake --build build
    
    - name: executer le programme
      run: ./build/Release/sobel
    
